<!-- ==================================
     MESSAGE FORM
=================================== -->

<div class="contact-form-container">

    <div class="form-header">

        <span>
            SEND A MESSAGE
        </span>

        <i class="fas fa-paper-plane"></i>

    </div>


    <form class="contact-form"
          action="https://api.web3forms.com/submit"
          method="POST">

        <input type="hidden"
               name="access_key"
               value="0582ddb2-94e3-4b0f-89e7-51b82fb4e9da">


        <input type="hidden"
               name="subject"
               value="New Portfolio Contact Message">


        <input type="hidden"
               name="from_name"
               value="Ahammed Yazin Portfolio">


        <!-- Name -->

        <div class="form-group">

            <label for="name">
                Your Name
            </label>

            <div class="input-box">

                <i class="fas fa-user"></i>

                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your name"
                       required>

            </div>

        </div>


        <!-- Email -->

        <div class="form-group">

            <label for="email">
                Your Email
            </label>

            <div class="input-box">

                <i class="fas fa-envelope"></i>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

            </div>

        </div>


        <!-- Subject -->

        <div class="form-group">

            <label for="message-subject">
                Subject
            </label>

            <div class="input-box">

                <i class="fas fa-heading"></i>

                <input type="text"
                       id="message-subject"
                       name="message_subject"
                       placeholder="What is this about?"
                       required>

            </div>

        </div>


        <!-- Message -->

        <div class="form-group">

            <label for="message">
                Message
            </label>

            <div class="input-box textarea-box">

                <i class="fas fa-message"></i>

                <textarea id="message"
                          name="message"
                          rows="6"
                          placeholder="Write your message..."
                          required></textarea>

            </div>

        </div>


        <!-- Submit -->

        <button type="submit"
                class="send-btn">

            <span>
                Send Message
            </span>

            <i class="fas fa-paper-plane"></i>

        </button>

    </form>

</div>
